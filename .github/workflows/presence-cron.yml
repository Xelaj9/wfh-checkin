name: Presence check cron

# ยิง /api/cron/presence ทุก 15 นาทีในเวลาทำงาน (จันทร์–ศุกร์)
# ใช้แทน Vercel Cron เพราะ Hobby plan รัน cron ได้แค่วันละครั้ง
# เวลาใน GitHub Actions เป็น UTC: 01:00–12:00 UTC ≈ 08:00–19:00 Asia/Bangkok
on:
  schedule:
    - cron: '*/15 1-12 * * 1-5'
  workflow_dispatch: {} # กดรันเองได้จากแท็บ Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger presence cron endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/presence")
          echo "HTTP $code"
          test "$code" = "200"
